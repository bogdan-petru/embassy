[package]
name = "embassy-mcxa5xx-examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-semihosting = "0.5"
cortex-m-rt = { version = "0.7", features = ["set-sp", "set-vtor"] }
crc = "3.4.0"
critical-section = "1.2.0"
defmt = "1.0"
defmt-rtt = "1.0"
embassy-embedded-hal = { version = "0.6.0", path = "../../embassy-embedded-hal" }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt"]  }
embassy-futures = { version = "0.1.2", path = "../../embassy-futures"}
embassy-mcxa = { version = "0.1.0", path = "../../embassy-mcxa", features = ["defmt", "unstable-pac", "mcxa5xx", "embedded-mcu-hal"] }
embassy-sync = { version = "0.8.0", path = "../../embassy-sync" }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-time-driver = { version = "0.2.2", path = "../../embassy-time-driver", optional = true }
embassy-usb = { version = "0.6.0", path = "../../embassy-usb", features = ["defmt"] }
embedded-io-async = "0.7.0"
embedded-hal-async = "1.0"
embedded-storage = "0.3.1"
heapless = "0.9.2"
nxp-shared-examples = { path = "../nxp-shared", optional = true }
panic-probe = { version = "1.0", features = ["print-defmt"] }
rand_core = "0.9"
static_cell = "2.1.1"
tmp108 = "0.4.0"
usbd-hid = "0.10.0"

[features]
default = ["default-executor"]
default-executor = [
  "embassy-executor/platform-cortex-m",
  "embassy-executor/executor-interrupt",
  "embassy-executor/executor-thread",
]
executor-platform = [
  "embassy-mcxa/executor-platform"
]
mcxa5xx = []
unstable-pac = []
i2c-one-shot = ["embassy-mcxa/i2c-one-shot", "dep:nxp-shared-examples"]
uart-one-shot = ["embassy-mcxa/uart-one-shot", "dep:nxp-shared-examples"]
# Same shared body/wire rate, different SoC clock policy for port qualification.
uart-port-clock-div2 = ["uart-one-shot"]

[[bin]]
name = "uart-one-shot-sender"
path = "src/bin/uart-one-shot-sender.rs"
required-features = ["uart-one-shot"]

[[bin]]
name = "uart-one-shot-receiver"
path = "src/bin/uart-one-shot-receiver.rs"
required-features = ["uart-one-shot"]

[[bin]]
name = "i2c-one-shot-controller"
path = "src/bin/i2c-one-shot-controller.rs"
required-features = ["i2c-one-shot"]

[[bin]]
name = "i2c-one-shot-target"
path = "src/bin/i2c-one-shot-target.rs"
required-features = ["i2c-one-shot"]

[[bin]]
name = "i2c-one-shot-cleanup-check"
path = "one-shot/checks/cleanup.rs"
required-features = ["i2c-one-shot"]

[[bin]]
name = "i2c-one-shot-write-read-controller"
path = "src/bin/i2c-one-shot-write-read-controller.rs"
required-features = ["i2c-one-shot"]

[[bin]]
name = "i2c-one-shot-write-read-target"
path = "src/bin/i2c-one-shot-write-read-target.rs"
required-features = ["i2c-one-shot"]

[[bin]]
name = "i2c-one-shot-rxstall-controller"
path = "one-shot/checks/rxstall-controller.rs"
required-features = ["i2c-one-shot"]

[[bin]]
name = "i2c-one-shot-rxstall-target"
path = "one-shot/checks/rxstall-target.rs"
required-features = ["i2c-one-shot"]

[[bin]]
name = "i2c-one-shot-watchdog-controller"
path = "one-shot/checks/watchdog-controller.rs"
required-features = ["i2c-one-shot"]

[[bin]]
name = "i2c-one-shot-watchdog-target"
path = "one-shot/checks/watchdog-target.rs"
required-features = ["i2c-one-shot"]

[profile.release]
lto = true # better optimizations
debug = 2  # enough information for defmt/rtt locations

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/examples/mcxa5xx" }
]
